<style>
        body { font-family: 'Geist', sans-serif; background-color: var(--color-background); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface antialiased flex flex-col h-screen overflow-hidden">
<!-- Mobile Header -->
<header class="flex items-center justify-between px-lg h-6xl bg-surface/80 backdrop-blur-md sticky top-0 z-50 border-b border-outline-variant/30 flex-shrink-0">
<button class="p-sm -ml-sm text-on-surface hover:text-primary transition-colors flex items-center justify-center">
<span class="material-symbols-outlined text-h4">arrow_back</span>
</button>
<h1 class="font-h5 text-h5 text-on-surface">Cart (1)</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Scrollable Content -->
<main class="flex-1 overflow-y-auto hide-scrollbar pb-32">
<div class="px-lg py-xl space-y-2xl">
<!-- Cart Item -->
<div class="flex gap-lg bg-surface p-md rounded-xl border border-outline-variant/30 shadow-sm relative">
<button class="absolute top-md right-md text-on-surface-variant hover:text-error transition-colors p-xs rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined text-h6">close</span>
</button>
<div class="w-24 h-24 flex-shrink-0 rounded-lg overflow-hidden bg-surface-container-low border border-outline-variant/20">
<img class="w-full h-full object-cover" data-alt="A sleek, modern automatic men's wristwatch with a brushed steel case and a deep charcoal dial. The watch features minimalist silver indices and hands, paired with a premium black leather strap. Shot in a bright, high-key studio environment emphasizing the premium, precise luxury aesthetic with soft, diffused lighting and a clean white background." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDwK9SEx0peMrcH0Mynom9M5ZLLYdUC-Bn7zPPsSwT4eRDMtjhOpRna7BMYxPa1U9eVbNqRc2fMp7VNBr3mXZqLuWxR0K1Qyi05AabGcMRvvGgoj6FtI-p4cfWvVzrAwXZ1wxkoRjBxoyp3LcoPfOSL_pghrnDUzcQuSV_BWAUfTW6BUfAjgla-mzslZZg_HTaDQDr-Z3HHKinR3mnvhQA8wEn7TNOFz_z0XPedLCEXShioT1XDgFtIF0pESOzkfmWCPXG9mSkGdbg"/>
</div>
<div class="flex flex-col justify-between flex-1 py-xs">
<div>
<h3 class="font-h6 text-h6 text-on-surface mb-xs pr-6">Apex Automatic Watch</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Color: Obsidian Black</p>
</div>
<div class="flex items-end justify-between mt-md">
<div class="flex items-center border border-outline-variant/50 rounded-lg h-9">
<button class="w-9 h-full flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors rounded-l-lg">
<span class="material-symbols-outlined text-[18px]">remove</span>
</button>
<span class="font-button text-button w-8 text-center flex items-center justify-center border-x border-outline-variant/30 h-full">1</span>
<button class="w-9 h-full flex items-center justify-center text-on-surface hover:bg-surface-container-low transition-colors rounded-r-lg">
<span class="material-symbols-outlined text-[18px]">add</span>
</button>
</div>
<span class="font-h6 text-h6 text-on-surface">$642.60</span>
</div>
</div>
</div>
<!-- Coupon Section -->
<div class="border border-outline-variant/30 rounded-xl bg-surface overflow-hidden shadow-sm">
<details class="group">
<summary class="flex justify-between items-center font-h6 text-h6 text-on-surface p-lg cursor-pointer list-none hover:bg-surface-container-low transition-colors">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary">local_offer</span>
                            Apply Promo Code
                        </div>
<span class="material-symbols-outlined transition-transform duration-200 group-open:-rotate-180 text-on-surface-variant">expand_more</span>
</summary>
<div class="p-lg pt-0 border-t border-outline-variant/20 bg-surface">
<div class="flex mt-md gap-sm">
<input class="flex-1 h-11 bg-surface-container-lowest border border-outline-variant/50 rounded-lg px-md font-body-sm text-body-sm text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow" placeholder="Enter code" type="text"/>
<button class="h-11 px-xl bg-on-surface text-on-primary font-button text-button rounded-lg hover:bg-on-surface/90 transition-colors">Apply</button>
</div>
</div>
</details>
</div>
<!-- Order Summary (Optional, good for context) -->
<div class="space-y-sm px-xs pt-md border-t border-outline-variant/30">
<div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
<span>Subtotal</span>
<span>$642.60</span>
</div>
<div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant">
<span>Shipping</span>
<span>Calculated at checkout</span>
</div>
</div>
</div>
</main>
<!-- Sticky Bottom Bar -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant/20 shadow-[0_-4px_20px_rgba(0,0,0,0.04)] px-lg py-lg pb-safe z-50 flex-shrink-0">
<div class="flex justify-between items-center mb-md px-xs">
<span class="font-h5 text-h5 text-on-surface">Total</span>
<span class="font-h4 text-h4 text-primary">$642.60</span>
</div>
<button class="w-full h-12 bg-primary text-on-primary font-button text-button rounded-lg shadow-sm hover:bg-surface-tint transition-all active:scale-[0.98] flex items-center justify-center gap-sm">
            Proceed to Checkout
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
<style>
        /* iOS safe area padding support for bottom bar */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    </style>
</body></html>

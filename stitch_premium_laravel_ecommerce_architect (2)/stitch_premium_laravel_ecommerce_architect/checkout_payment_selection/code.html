<!DOCTYPE html>

<style>
        body {
            background-color: #FFFDF8;
        }
        /* Custom radio button styling */
        input[type="radio"]:checked {
            accent-color: #9d4300;
        }

<body class="font-body-default text-body-default text-on-surface antialiased">
<!-- TopNavBar (Transactional - minimal) -->
<header class="bg-surface/80 backdrop-blur-md border-b border-outline-variant/30 sticky top-0 z-50">
<div class="flex justify-between items-center h-16 px-gutter max-w-container-max mx-auto">
<div class="font-display text-h4 font-bold text-on-surface">LUXE</div>
<div class="flex items-center gap-2 text-on-surface-variant font-nav text-nav uppercase tracking-wider">
<span class="material-symbols-outlined text-[18px]">lock</span>
                Secure Checkout
            </div>
</div>
</header>
<main class="max-w-[800px] mx-auto px-gutter py-8xl min-h-screen">
<!-- Checkout Progress -->
<div class="mb-5xl">
<nav aria-label="Progress">
<ol class="flex items-center" role="list">
<li class="relative pr-8 sm:pr-20">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="h-0.5 w-full bg-primary"></div>
</div>
<a class="relative flex h-8 w-8 items-center justify-center rounded-full bg-primary hover:bg-primary/90" href="#">
<span class="material-symbols-outlined text-white text-[16px]">check</span>
<span class="sr-only">Information</span>
</a>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-caption text-caption text-on-surface-variant whitespace-nowrap">Information</span>
</li>
<li class="relative pr-8 sm:pr-20">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="h-0.5 w-full bg-primary"></div>
</div>
<a class="relative flex h-8 w-8 items-center justify-center rounded-full bg-primary hover:bg-primary/90" href="#">
<span class="material-symbols-outlined text-white text-[16px]">check</span>
<span class="sr-only">Shipping</span>
</a>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-caption text-caption text-on-surface-variant whitespace-nowrap">Shipping</span>
</li>
<li class="relative">
<a class="relative flex h-8 w-8 items-center justify-center rounded-full border-2 border-primary bg-surface" href="#">
<span class="font-button text-button text-primary">3</span>
<span class="sr-only">Payment</span>
</a>
<span class="absolute -bottom-6 left-1/2 -translate-x-1/2 font-caption text-caption text-primary font-bold whitespace-nowrap">Payment</span>
</li>
</ol>
</nav>
</div>
<div class="mb-6xl">
<h1 class="font-h2 text-h2 text-on-surface mb-xs">Payment Method</h1>
<p class="font-body-default text-body-default text-on-surface-variant">All transactions are secure and encrypted.</p>
</div>
<!-- Payment Options Form -->
<form class="space-y-3xl">
<div class="bg-surface rounded-lg shadow-sm border border-outline-variant/50 overflow-hidden transition-all duration-200">
<!-- Credit Card Option (Active) -->
<div class="p-lg border-b border-outline-variant/30 bg-surface-container-lowest relative cursor-pointer group">
<label class="flex items-center gap-md cursor-pointer w-full">
<input checked="" class="w-4 h-4 text-primary border-outline focus:ring-primary" name="payment_method" type="radio" value="card"/>
<span class="font-h6 text-h6 text-on-surface flex-1">Credit or Debit Card</span>
<div class="flex gap-2">
<span class="material-symbols-outlined text-on-surface-variant">credit_card</span>
</div>
</label>
<!-- Card Details Form -->
<div class="mt-4xl pl-xl pr-md pb-md space-y-4xl animate-fade-in">
<div class="relative">
<label class="block font-body-sm text-body-sm font-medium text-on-surface mb-xs" for="cardNumber">Card Number</label>
<div class="relative">
<input class="block w-full h-11 px-md rounded bg-surface border border-outline-variant text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="cardNumber" name="cardNumber" placeholder="0000 0000 0000 0000" type="text"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
</div>
</div>
<div class="grid grid-cols-2 gap-md">
<div>
<label class="block font-body-sm text-body-sm font-medium text-on-surface mb-xs" for="expiry">Expiration Date (MM/YY)</label>
<input class="block w-full h-11 px-md rounded bg-surface border border-outline-variant text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="expiry" name="expiry" placeholder="MM / YY" type="text"/>
</div>
<div>
<label class="block font-body-sm text-body-sm font-medium text-on-surface mb-xs flex items-center gap-xs" for="cvv">
                                    Security Code
                                    <span class="material-symbols-outlined text-[16px] text-on-surface-variant cursor-help" title="3 digit code on back of card">help</span>
</label>
<input class="block w-full h-11 px-md rounded bg-surface border border-outline-variant text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="cvv" name="cvv" placeholder="123" type="text"/>
</div>
</div>
<div>
<label class="block font-body-sm text-body-sm font-medium text-on-surface mb-xs" for="nameOnCard">Name on Card</label>
<input class="block w-full h-11 px-md rounded bg-surface border border-outline-variant text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary focus:ring-2 focus:ring-primary/10 transition-shadow" id="nameOnCard" name="nameOnCard" placeholder="First Last" type="text"/>
</div>
<div class="flex items-center gap-sm mt-xl">
<input class="w-4 h-4 rounded border-outline text-primary focus:ring-primary" id="saveCard" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="saveCard">Save this card for future securely</label>
</div>
</div>
</div>
<!-- UPI Option -->
<div class="p-lg border-b border-outline-variant/30 hover:bg-surface-container-lowest transition-colors cursor-pointer opacity-70 hover:opacity-100">
<label class="flex items-center gap-md cursor-pointer w-full">
<input class="w-4 h-4 border-outline text-primary focus:ring-primary" name="payment_method" type="radio" value="upi"/>
<span class="font-h6 text-h6 text-on-surface flex-1">UPI</span>
<span class="material-symbols-outlined text-on-surface-variant">qr_code_scanner</span>
</label>
</div>
<!-- Net Banking Option -->
<div class="p-lg border-b border-outline-variant/30 hover:bg-surface-container-lowest transition-colors cursor-pointer opacity-70 hover:opacity-100">
<label class="flex items-center gap-md cursor-pointer w-full">
<input class="w-4 h-4 border-outline text-primary focus:ring-primary" name="payment_method" type="radio" value="netbanking"/>
<span class="font-h6 text-h6 text-on-surface flex-1">Net Banking</span>
<span class="material-symbols-outlined text-on-surface-variant">account_balance</span>
</label>
</div>
<!-- PayPal Option -->
<div class="p-lg hover:bg-surface-container-lowest transition-colors cursor-pointer opacity-70 hover:opacity-100">
<label class="flex items-center gap-md cursor-pointer w-full">
<input class="w-4 h-4 border-outline text-primary focus:ring-primary" name="payment_method" type="radio" value="paypal"/>
<span class="font-h6 text-h6 text-on-surface flex-1">PayPal</span>
<span class="material-symbols-outlined text-on-surface-variant">payments</span>
</label>
</div>
</div>
<!-- Total and CTA -->
<div class="mt-8xl pt-3xl border-t border-outline-variant/30 flex flex-col sm:flex-row items-center justify-between gap-4xl">
<div>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-xs">Total to pay</p>
<p class="font-h3 text-h3 text-on-surface">$245.00</p>
</div>
<button class="w-full sm:w-auto px-6xl py-md bg-primary hover:bg-surface-tint text-on-primary font-button text-button rounded transition-colors duration-200 flex items-center justify-center gap-sm shadow-sm hover:shadow-md" type="button">
<span class="material-symbols-outlined text-[20px]">lock</span>
                    Pay Now
                </button>
</div>
<p class="text-center mt-xl font-caption text-caption text-on-surface-variant flex items-center justify-center gap-xs">
<span class="material-symbols-outlined text-[14px]">shield</span>
                Guaranteed safe &amp; secure checkout
            </p>
</form>
</main>
<!-- Footer (Minimal for Checkout) -->
<footer class="bg-surface-container-highest border-t border-outline-variant w-full py-6xl px-gutter mt-8xl">
<div class="max-w-container-max mx-auto text-center font-body-sm text-body-sm text-on-surface-variant">
            © 2024 LUXE Ecommerce. All rights reserved.
        </div>
</footer>
<script>
        // Simple script to toggle active state visual for radio buttons (expanding/collapsing the card details form)
        // In a real app this would be more robust.
        document.addEventListener('DOMContentLoaded', () => {
            const radioButtons = document.querySelectorAll('input[name="payment_method"]');
            const cardForm = document.querySelector('.animate-fade-in');
            const containers = document.querySelectorAll('.bg-surface > div');

            radioButtons.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    // Reset all opacity
                    containers.forEach(c => {
                        c.classList.remove('bg-surface-container-lowest', 'opacity-100');
                        c.classList.add('opacity-70');
                    });
                    
                    // Set active
                    const activeContainer = e.target.closest('.p-lg');
                    activeContainer.classList.remove('opacity-70');
                    activeContainer.classList.add('bg-surface-container-lowest', 'opacity-100');

                    if (e.target.value === 'card') {
                        cardForm.style.display = 'block';
                    } else {
                        cardForm.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body></html>
